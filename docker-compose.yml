services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cartoonize
      POSTGRES_USER: cartoonize
      POSTGRES_PASSWORD: cartoonize
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cartoonize -d cartoonize"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: deploy/backend/Dockerfile
    command: cartoonize serve --host 0.0.0.0 --port 7317
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://cartoonize:cartoonize@postgres:5432/cartoonize
      REDIS_URL: redis://redis:6379/0
      REDIS_ENABLED: "true"
      WORK_ROOT: /data/cartoonize
    volumes:
      - workdata:/data/cartoonize
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "7317"

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./src:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    expose:
      - "5173"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
  redisdata:
  workdata:
  frontend_node_modules:
