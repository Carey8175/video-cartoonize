version: "3.9"

# 本地开发用：启动 PostgreSQL + Redis
# 使用方式：
#   docker compose up -d
#   DATABASE_URL=postgresql+asyncpg://cartoonize:cartoonize@localhost/cartoonize \
#   REDIS_URL=redis://localhost:6379/0 \
#   cartoonize serve

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cartoonize
      POSTGRES_USER: cartoonize
      POSTGRES_PASSWORD: cartoonize
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cartoonize"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
