[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-cartoonize"
version = "0.5.4"
description = "Real-video → anime/cartoon pipeline CLI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "scenedetect[opencv]",
    "opencv-python",
    "tos",
    "Pillow",
    "truststore;python_version>='3.10'",  # 用系统 keychain 解决公司 MITM 证书
    "certifi",                              # fallback CA bundle
]

[project.scripts]
cartoonize = "video_cartoonize.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["video_cartoonize*"]

[tool.setuptools.package-data]
video_cartoonize = ["style_refs/**/*", "skill/**/*"]
